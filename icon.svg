<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060a12" />
    </radialGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="foodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#22c55e" stroke-width="3" stroke-opacity="0.35" />

  <!-- Grid mesh watermark -->
  <path d="M64 0v512M128 0v512M192 0v512M256 0v512M320 0v512M384 0v512M448 0v512M0 64h512M0 128h512M0 192h512M0 256h512M0 320h512M0 384h512M0 448h512" 
        stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Glowing Food (Red Apple with leaf) -->
  <g transform="translate(370, 140)">
    <!-- Food Glow -->
    <circle cx="0" cy="0" r="48" fill="#ef4444" fill-opacity="0.25" filter="url(#neonGlow)" />
    <!-- Apple Core -->
    <circle cx="0" cy="0" r="32" fill="url(#foodGlow)" />
    <!-- Highlight -->
    <circle cx="-10" cy="-10" r="8" fill="#ffffff" fill-opacity="0.75" />
    <!-- Leaf -->
    <path d="M0 -30 Q 18 -45 22 -32 Q 10 -22 0 -30" fill="#22c55e" />
  </g>

  <!-- Snake Body Path -->
  <g filter="url(#neonGlow)">
    <!-- Body Segment Bridges -->
    <path d="M 120 380 Q 120 280 200 280 Q 280 280 280 200 Q 280 140 330 140" 
          fill="none" stroke="url(#snakeGrad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Coiled Tail Segment -->
    <circle cx="120" cy="380" r="24" fill="#10b981" />
    
    <!-- Snake Head -->
    <circle cx="330" cy="140" r="36" fill="#22c55e" />
    
    <!-- Forked Red Tongue -->
    <path d="M 360 140 L 400 140 M 400 140 L 418 128 M 400 140 L 418 152" 
          stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
    
    <!-- Expressive Eyes -->
    <ellipse cx="340" cy="120" rx="9" ry="8" fill="#ffffff" />
    <ellipse cx="340" cy="160" rx="9" ry="8" fill="#ffffff" />
    <ellipse cx="344" cy="120" rx="4" ry="7" fill="#0f172a" />
    <ellipse cx="344" cy="160" rx="4" ry="7" fill="#0f172a" />
  </g>
</svg>